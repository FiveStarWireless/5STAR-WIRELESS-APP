workflows:
  android-release:
    name: Android Release
    max_build_duration: 60
    environment:
      flutter: stable
      vars:
        BUILD_NUMBER: 300          # bump this higher every Play upload (301, 302…)
        BUILD_NAME: 1.0.0          # version name shown in Play Store
    scripts:
      - name: Pre-build (firebase json + signing via key.properties)
        script: |
          set -e
          mkdir -p android/app

          # 1) Firebase config (skip quietly if not present)
          cp "$CM_SECURE_FILES_DIR/google-services.json" android/app/google-services.json 2>/dev/null || true

          # 2) Decode keystore from Base64 env var into a .jks file
          #    (You must set JKS_B64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD in Environment variables)
          echo $JKS_B64 | base64 --decode > android/app/5star-release.jks

          # 3) Generate key.properties for Gradle (single source of truth)
          printf "%s\n" \
            "storeFile=app/5star-release.jks" \
            "storePassword=${KEYSTORE_PASSWORD}" \
            "keyAlias=${KEY_ALIAS}" \
            "keyPassword=${KEY_PASSWORD}" \
            > android/key.properties

          echo "✅ Keystore + key.properties ready"

      - name: Build AAB (release)
        script: |
          flutter clean
          flutter pub get
          flutter build appbundle --release --build-number="$BUILD_NUMBER" --build-name="$BUILD_NAME"

    artifacts:
      - build/app/outputs/bundle/release/*.aab
